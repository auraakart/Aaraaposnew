name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  api:
    name: API quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run policy
      - run: npm run typecheck
      - run: npm test

  mobile:
    name: Flutter quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pos_mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --no-pub

  baseline:
    name: Foundation baseline gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: test -f docs/V0_BASELINE.md
      - run: test -f services/api/db/migrations/0001_foundation.sql




  database:
    name: PostgreSQL migration & RLS gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aaraapos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aaraapos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: aaraapos_ci
    steps:
      - uses: actions/checkout@v7
      - name: Confirm PostgreSQL client
        run: psql --version
      - name: Apply migrations to clean PostgreSQL
        run: |
          set -euo pipefail
          for migration in services/api/db/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -v ON_ERROR_STOP=1 -f "${migration}"
          done
      - name: Verify schema and tenant RLS behavior
        run: psql -v ON_ERROR_STOP=1 -f services/api/scripts/database-integration.sql


  v221-lock-generate:
    name: V2.21 package lock generation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Generate exact npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit package lock
        shell: bash
        run: |
          printf '@@AARAAPOS_LOCK@@\n'
          base64 -w0 package-lock.json
          printf '\n@@AARAAPOS_END@@\n'
