name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  api:
    name: API quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run policy
      - run: npm run typecheck
      - run: npm test

  mobile:
    name: Flutter quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pos_mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --no-pub

  baseline:
    name: Foundation baseline gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: test -f docs/V0_BASELINE.md
      - run: test -f services/api/db/migrations/0001_foundation.sql


